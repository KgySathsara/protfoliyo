<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Expense tracker illustration</title>
  <desc id="desc">A personal finance app screen with expenses, category chart, and spending summary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d2933"/>
      <stop offset="100%" stop-color="#123f4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8cedba"/>
      <stop offset="100%" stop-color="#66f6db"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="666" cy="104" r="96" fill="#8cedba" opacity="0.12"/>

  <rect x="116" y="64" width="244" height="432" rx="42" fill="#0a1820" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="198" y="82" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <text x="146" y="128" fill="#e6fffb" font-size="18" font-family="Arial, sans-serif">March Summary</text>
  <text x="146" y="172" fill="#ffffff" font-size="34" font-family="Arial, sans-serif">$1,286</text>
  <text x="146" y="198" fill="#9ec6c7" font-size="13" font-family="Arial, sans-serif">Total spending this month</text>

  <circle cx="238" cy="276" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="24"/>
  <circle cx="238" cy="276" r="64" fill="none" stroke="#66f6db" stroke-width="24" stroke-dasharray="220 182" transform="rotate(-90 238 276)"/>
  <circle cx="238" cy="276" r="40" fill="#0a1820"/>
  <text x="206" y="282" fill="#dffdfa" font-size="16" font-family="Arial, sans-serif">Savings</text>

  <rect x="146" y="370" width="184" height="44" rx="18" fill="#ffffff" fill-opacity="0.05"/>
  <text x="168" y="398" fill="#ffffff" font-size="15" font-family="Arial, sans-serif">Food</text>
  <text x="286" y="398" fill="#8cedba" font-size="14" font-family="Arial, sans-serif">$320</text>
  <rect x="146" y="426" width="184" height="44" rx="18" fill="#ffffff" fill-opacity="0.05"/>
  <text x="168" y="454" fill="#ffffff" font-size="15" font-family="Arial, sans-serif">Travel</text>
  <text x="286" y="454" fill="#8cedba" font-size="14" font-family="Arial, sans-serif">$180</text>

  <rect x="404" y="94" width="284" height="130" rx="26" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="432" y="132" fill="#e6fffb" font-size="18" font-family="Arial, sans-serif">Budget Status</text>
  <rect x="432" y="156" width="228" height="18" rx="9" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="432" y="156" width="150" height="18" rx="9" fill="url(#accent)" opacity="0.85"/>
  <text x="432" y="198" fill="#9ec6c7" font-size="13" font-family="Arial, sans-serif">62% of monthly budget used</text>

  <rect x="404" y="252" width="284" height="228" rx="26" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="432" y="290" fill="#e6fffb" font-size="18" font-family="Arial, sans-serif">Recent Expenses</text>
  <rect x="432" y="314" width="228" height="46" rx="18" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="458" cy="337" r="12" fill="url(#accent)" opacity="0.84"/>
  <text x="484" y="333" fill="#ffffff" font-size="15" font-family="Arial, sans-serif">Groceries</text>
  <text x="484" y="351" fill="#9ec6c7" font-size="12" font-family="Arial, sans-serif">Daily essentials</text>
  <text x="618" y="341" fill="#8cedba" font-size="14" font-family="Arial, sans-serif">$42</text>
  <rect x="432" y="374" width="228" height="46" rx="18" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="458" cy="397" r="12" fill="url(#accent)" opacity="0.62"/>
  <text x="484" y="393" fill="#ffffff" font-size="15" font-family="Arial, sans-serif">Transport</text>
  <text x="484" y="411" fill="#9ec6c7" font-size="12" font-family="Arial, sans-serif">Fuel and rides</text>
  <text x="618" y="401" fill="#8cedba" font-size="14" font-family="Arial, sans-serif">$28</text>
  <rect x="432" y="434" width="228" height="24" rx="12" fill="#ffffff" fill-opacity="0.05"/>
</svg>
