      <stop offset="0%" stop-color="#3b2218"/>
      <stop offset="100%" stop-color="#24130f"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5b971"/>
      <stop offset="100%" stop-color="#ffd9a4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="660" cy="108" r="90" fill="#f5b971" opacity="0.12"/>
  <rect x="72" y="58" width="656" height="444" rx="30" fill="#1e120e" opacity="0.94" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(180 170) rotate(-8 180 90)">
