    <text x="36" y="126" fill="#5b3613" font-size="17" font-family="Arial, sans-serif">Zone A  Row 04  Seat 18</text>
    <text x="36" y="158" fill="#5b3613" font-size="15" font-family="Arial, sans-serif">Saturday 7:30 PM</text>
    <rect x="292" y="34" width="94" height="94" rx="18" fill="#fff8ef" fill-opacity="0.82"/>
    <rect x="308" y="50" width="16" height="16" fill="#4c2b0d"/>
    <rect x="328" y="50" width="16" height="16" fill="#4c2b0d"/>
    <rect x="348" y="50" width="16" height="16" fill="#4c2b0d"/>
    <rect x="308" y="70" width="16" height="16" fill="#4c2b0d"/>
    <rect x="348" y="70" width="16" height="16" fill="#4c2b0d"/>
    <rect x="328" y="90" width="16" height="16" fill="#4c2b0d"/>
    <rect x="368" y="90" width="16" height="16" fill="#4c2b0d"/>
    <rect x="36" y="180" width="350" height="2" fill="#4c2b0d" fill-opacity="0.18"/>
