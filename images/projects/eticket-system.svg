<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">eTicket system illustration</title>
  <desc id="desc">A stack of digital event tickets with a QR code and validation scanner.</desc>
  <defs>
